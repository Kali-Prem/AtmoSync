version: '3.8'

services:
  database:
    image: timescale/timescaledb-ha:pg16
    container_name: vayudrishti_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vayudrishti_db
      POSTGRES_USER: vayudrishti
      POSTGRES_PASSWORD: vayudrishti_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayudrishti -d vayudrishti_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vayudrishti_net

  cache:
    image: redis:7-alpine
    container_name: vayudrishti_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vayudrishti_net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: vayudrishti_api
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg://vayudrishti:vayudrishti_password@database:5432/vayudrishti_db
      REDIS_URL: redis://cache:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - vayudrishti_net

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: vayudrishti_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:8000
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - vayudrishti_net

volumes:
  postgres_data:
  redis_data:

networks:
  vayudrishti_net:
    driver: bridge
